name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows 是必需项：shell 引号化 / PATH 解析 / 全局 bin 定位这类逻辑只在
        # Windows 生效，macos+ubuntu 跑不到——issue #1 就是这么漏掉的。
        # 全量能跑是因为 fixture 已按平台生成，见 test-utils/fakebin.js。
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
